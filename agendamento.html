<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>
        <H2 id="agendamento">Agende sua consulta</H2>
        <form action="#" method="post" class="formulário">
            <label for="nome">Nome Completo:</label>
            <input 
                type="text" name="nome" id="nome" required class="campo"> 
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" class="campo">
            <br>
            <label for="telefone">Telefone:</label>
            <input 
                  type="tel"
                  name="telefone"
                 id="telefone" 
                 required
                 inputmode="numeric"
                 maxlength="15"
                 pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                 title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321"
                 class="campo"
            >
            <br>
            <label for="data">Data:</label>
            <input type="date" name="data" id="data" required class="campo">
            <br>
            <label for="hora">hora:</label>
            <input type="time" name="hora" id="hora" required class="campo">
            <br>
            <label for="especialidades">Especialidades</label>
            <select name="especialidades" id="especialidades" required class="opção">
                <option value="">Selecione uma opção</option>
                <option value="clinico-geral">Clínico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="dermatologia">Dermatologia</option>
                <option value="pediatria">Pediatria</option>
            </select>
            <br>
            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" rows="4" class="areadetexto"></textarea>
            <br>
            <button type="submit">Confirmar agendamento</button>
        </form>
    </main>

    <footer id="pe">
        <p>
            <i>Clínica Vida Plena</i> - Todos os direitos reservados.
        </p>
    </footer>

</body>

</html>
